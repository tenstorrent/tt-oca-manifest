name: CI

# Producer (Python packer/signer) and Consumer (C validator) are tested
# together, because the consumer suite drives the producer: the fixture sweep
# packs each YAML config with `tt_boot_manifest.pack_images` and then validates
# the resulting binary with the C CLI. A job that has one without the other
# cannot run the tests that matter most.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The test files that compile C. Whether they pass depends on the compiler,
  # not the Python version, so the c-validator job runs them under gcc and
  # clang, and the pytest job runs them on one Python version only. Every test
  # file that imports oca_fixtures.toolchain belongs on this list;
  # tests/test_oca_fixtures_toolchain.py fails until it is.
  COMPILER_TESTS: >-
    tests/test_oca_build_config_check_header.py
    tests/test_oca_build_config_code_points.py
    tests/test_oca_build_config_makefile.py
    tests/test_oca_build_config_matrix.py
    tests/test_oca_build_guard.py
    tests/test_oca_callback_layout.py
    tests/test_oca_hash_row_size.py
    tests/test_oca_integration_build_snippets.py
    tests/test_oca_layout_self_check.py
    tests/test_oca_result_names.py

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }}, cryptography ${{ matrix.cryptography }})
    # 26.04 is the first Ubuntu LTS whose libssl-dev is OpenSSL 3.5 or later,
    # which the validator CLI needs for ML-DSA-87. On 24.04 (OpenSSL 3.0) the
    # CLI build refuses, and every validator integration test fails.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared by requires-python; 3.12 is the newest
        # version the classifiers claim. Local development runs 3.14, which is
        # deliberately not tested here until the classifiers say so.
        python-version: ['3.11', '3.12']
        cryptography: ['latest']
        # The dependency floor. pyproject.toml promises cryptography 48.0.0 is
        # enough -- the first release whose wheels provide ML-DSA -- but every
        # other leg resolves the newest release, so without this one the floor
        # is never exercised. Paired with the Python floor: the oldest
        # combination a user can install.
        #
        # Only the 3.11 / latest leg runs the compiler tests, so the build
        # configuration generator is still tested on the oldest Python. The
        # c-validator job runs them under each compiler.
        include:
          - python-version: '3.11'
            cryptography: '48.0.0'
            skip-compiler-tests: true
          - python-version: '3.12'
            cryptography: 'latest'
            skip-compiler-tests: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The consumer tests build the C CLI on demand and link it against
      # OpenSSL, and the integration guide's snippet tests build an adopter
      # project with CMake under Ninja and Unix Makefiles. Installed before
      # anything runs, because their absence does not fail the suite -- it
      # silently shrinks it. See the assertion below.
      - name: Install C toolchain, OpenSSL headers, CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake ninja-build

      # doxygen is the entity-discovery documentation gate: absent, its test
      # skips rather than failing, so it is installed here and asserted below.
      #
      # Pinned rather than installed from apt. Ubuntu 24.04 through 25.10
      # package doxygen 1.9.8, and that release reports every documented
      # function in a file containing an #include directive as undocumented:
      # "parameters of member X are not documented" against complete
      # @param/@return blocks. 26.04 packages 1.15.0, which is clean, but the
      # pin keeps the gate on one known release whatever the runner image.
      #
      # Upstream this is https://github.com/doxygen/doxygen/issues/11147 :
      # the warnings mis-fire when only XML is generated, which is exactly how
      # the gate's Doxyfile runs.  This was fixed in 1.13.0 by PR #11151. Bug
      # reproduced in a clean noble container against a one-function header;
      # 1.15.0 and 1.18.0 are clean on the identical input, and no Doxyfile
      # setting works around it (ENABLE_PREPROCESSING=NO does not help, and
      # WARN_NO_PARAMDOC=NO would drop the check the gate exists to make).
      # tests/test_oca_c_doxygen.py proves the installed binary against a
      # canary header and skips on this bug, so without the pin the gate would
      # not fail here -- it would quietly stop running, which the assertion
      # below turns back into a loud failure.
      - name: Install doxygen 1.18.0, pinned by checksum
        run: |
          version=1.18.0
          sha256=14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
          curl -fsSL -o "$RUNNER_TEMP/doxygen.tar.gz" \
            "https://github.com/doxygen/doxygen/releases/download/Release_${version//./_}/doxygen-${version}.linux.bin.tar.gz"
          echo "$sha256  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-$version/bin" >> "$GITHUB_PATH"

      # tests/test_oca_c_validator_integration.py calls pytest.skip() when make
      # or pkg-config is missing, and tests/test_oca_c_doxygen.py when doxygen
      # is absent or exhibits the 1.9.8 false-positive bug, so a broken
      # toolchain would read as a green run with a quietly smaller suite. Fail
      # here instead, where the cause is obvious. The doxygen check pins the
      # exact version so a stray apt doxygen shadowing the pinned one cannot
      # skip the gate silently.
      - name: Assert the consumer prerequisites are present
        run: |
          make --version
          cmake --version
          ninja --version
          pkg-config --modversion openssl
          pkg-config --atleast-version=3.5.0 openssl \
            || { echo "::error::the validator CLI needs OpenSSL 3.5 or later for ML-DSA-87"; exit 1; }
          case "$(doxygen --version)" in
            1.18.0*) doxygen --version ;;
            *) echo "::error::expected pinned doxygen 1.18.0, got '$(doxygen --version)'"
               exit 1 ;;
          esac

      # `dev` only, deliberately: the AWS tests are deselected below, so this
      # installs what a contributor without the `aws` extra has, and a test
      # module that imports boto3 or botocore at module scope fails collection
      # here as well as in tests/test_optional_aws_dependency.py.
      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          if [ "${{ matrix.cryptography }}" != latest ]; then
            python -m pip install "cryptography==${{ matrix.cryptography }}"
          fi
          python -c "import cryptography; print('cryptography', cryptography.__version__)"

      # Deselected rather than skipped: the AWS KMS tests need live credentials,
      # and `-m "not aws"` makes their absence an explicit exclusion instead of
      # nine skips that look like a partial failure. Expect 0 skipped.
      #
      # TT_BOOT_MANIFEST_REQUIRE_VALIDATOR turns the validator integration
      # tests' skip on a missing toolchain or an old OpenSSL into a failure, so
      # the suite cannot shrink here unnoticed.
      - name: Run the producer and consumer test suites
        env:
          TT_BOOT_MANIFEST_REQUIRE_VALIDATOR: "1"
        run: |
          ignored=""
          if [ "${{ matrix.skip-compiler-tests }}" = true ]; then
            for path in $COMPILER_TESTS; do ignored="$ignored --ignore=$path"; done
          fi
          python -m pytest -m "not aws" $ignored

  c-validator:
    name: C validator (${{ matrix.cc }})
    # OpenSSL 3.5 or later, for ML-DSA-87; see the pytest job.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      # The integration guide's snippet tests, among the compiler tests below,
      # need CMake and Ninja.
      - name: Install C toolchain, OpenSSL headers, CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config libssl-dev cmake ninja-build

      # `make check` runs a fixture sweep that packs manifests with the producer,
      # so the Python package has to be importable by the interpreter the
      # Makefile picks up. PYTHON= is passed explicitly below rather than relying
      # on its search order.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,aws]'

      # Logged to RUNNER_TEMP rather than the workspace so a local reproduction
      # of these steps cannot leave an untracked file in the tree.
      - name: Build the library and CLI, run the C unit tests and fixture sweep
        run: |
          set -o pipefail
          make -C validators/oca \
            CC=${{ matrix.cc }} PYTHON="$(command -v python)" check 2>&1 \
            | tee "$RUNNER_TEMP/check.log"

      # `make check` exits 0 down several "nothing to build" paths -- an empty
      # lib/, a missing test/unit_test.c, zero fixtures. Each prints a notice
      # and succeeds, which is indistinguishable from a real pass in a CI log.
      # Require positive evidence instead of trusting the exit code.
      - name: Reject a vacuous pass
        run: |
          log="$RUNNER_TEMP/check.log"
          if grep -qE 'skipping archive|skipping link|no fixtures yet' "$log"; then
            echo "::error::make check declined to build something and still succeeded"
            grep -nE 'skipping archive|skipping link|no fixtures yet' "$log"
            exit 1
          fi
          # Two independent "N/N passed" summaries are expected: the C unit-test
          # driver, then the fixture sweep.
          summaries=$(grep -cE '^[0-9]+/[0-9]+ passed' "$log" || true)
          if [ "$summaries" -lt 2 ]; then
            echo "::error::expected 2 'N/N passed' summaries in the check output, saw $summaries"
            exit 1
          fi
          # The default configuration enables everything, so a unit test it
          # does not run is gated on something it never turns off.
          if grep -q '^NOT RUN:' "$log"; then
            echo "::error::the default configuration left unit tests unrun"
            grep -n '^NOT RUN:' "$log"
            exit 1
          fi
          for artifact in \
            validators/oca/build/lib/liboca_validator.a \
            validators/oca/build/test/oca-validate \
            validators/oca/build/test/unit_test; do
            test -s "$artifact" || { echo "::error::missing build artifact $artifact"; exit 1; }
          done

      # -Wdocumentation is Clang-only, so the Makefile probes for it and adds it
      # only when the compiler accepts it. A probe that fails for the wrong
      # reason -- a shell quirk, a wrapper that swallows the exit status -- still
      # builds green, with the doc gate simply absent. Assert the outcome the
      # probe is supposed to reach on each compiler instead, reading the recorded
      # flag stamp rather than the compile log.
      - name: Assert the doc-comment warnings resolved as the probe intends
        run: |
          stamp=validators/oca/build/lib/.cflags
          test -s "$stamp" || { echo "::error::no flag stamp at $stamp"; exit 1; }
          if grep -q -- -Wdocumentation "$stamp"; then present=yes; else present=no; fi
          case "${{ matrix.cc }}:$present" in
            clang:yes|gcc:no) echo "${{ matrix.cc }}: -Wdocumentation present=$present, as expected" ;;
            clang:no)  echo "::error::clang accepts -Wdocumentation but the probe dropped it"; exit 1 ;;
            gcc:yes)   echo "::error::-Wdocumentation reached a gcc build; the probe is not gating"; exit 1 ;;
          esac

      # The tests compile with whatever CC and CXX name. Setting them here runs
      # the tests with this leg's compiler instead of the runner's cc, which is
      # gcc.
      - name: Run the compiler tests under ${{ matrix.cc }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          TT_BOOT_MANIFEST_REQUIRE_VALIDATOR: "1"
        run: python -m pytest -m "not aws" $COMPILER_TESTS

      # A consumer that must never accept a variant turns it off in [variants] of
      # its build configuration. All three configurations have to keep building,
      # or that setting has quietly stopped being an option; so does the least
      # configuration, a hash and nothing else.
      - name: Build the variant-gated configurations
        run: |
          for target in both classic-only pqc-only hash-only; do
            make -C validators/oca CC=${{ matrix.cc }} "$target"
            binary="validators/oca/build/$target/test/oca-validate"
            test -x "$binary" || { echo "::error::$target produced no CLI at $binary"; exit 1; }
          done

  # Firmware cross-compiles the library for a small target. Within that target,
  # pointers and size_t are 32 bits and an enum can be smaller than an int,
  # which a host build never shows. This job builds every configuration for
  # 32-bit RISC-V with -fshort-enums. Warnings are errors, so any warning fails
  # the job. Nothing is linked or run, because that needs an integrator's
  # callbacks.
  cross-build:
    name: C validator library (rv32, short enums)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the RISC-V cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf
          riscv64-unknown-elf-gcc --version

      # Each archive must hold one 32-bit RISC-V object for each library source.
      # A leftover host object or a skipped source fails the check.
      - name: Build every configuration for rv32 with short enums
        run: |
          cross=riscv64-unknown-elf
          sources=$(ls validators/oca/lib/*.c | wc -l)
          for config in lib/oca_config.toml validators/oca/test/build_configs/*.toml; do
            config=${config#validators/oca/}
            name=$(basename "$config" .toml)
            make -C validators/oca BUILD="build/rv32-$name" CONFIG="$config" \
              CC=$cross-gcc AR=$cross-ar \
              EXTRA_CFLAGS="-march=rv32imac -mabi=ilp32 -fshort-enums" lib
            archive="validators/oca/build/rv32-$name/lib/liboca_validator.a"
            headers=$($cross-readelf -h "$archive" 2>&1 || true)
            members=$($cross-ar t "$archive" | wc -l)
            elf32=$(grep -cE 'Class:[[:space:]]+ELF32' <<<"$headers" || true)
            riscv=$(grep -cE 'Machine:[[:space:]]+RISC-V' <<<"$headers" || true)
            if [ "$members" -ne "$sources" ] || [ "$elf32" -ne "$sources" ] \
                || [ "$riscv" -ne "$sources" ]; then
              echo "::error::$name: $members members, $elf32 ELF32, $riscv RISC-V; expected $sources of each"
              exit 1
            fi
            echo "$name: $sources rv32 objects, $($cross-size -t "$archive" | tail -n 1 | awk '{print $4}') bytes"
          done
