# RSA-3072 signed manifest using the LEGACY public exponent 3 (raw key
# encoding). The raw form is 388 bytes for any exponent -- big-endian modulus
# followed by a 4-byte big-endian exponent -- so this pins that the C backend
# reconstructs the key from those trailing four bytes rather than assuming F4.
manifest_format: oca-classic
manifest_identifier: "RSAE3F"
description: "RSA-3072 signed fixture (secure_rsa_e3)"
secure_boot: 1
signature_type: 0x01
signing_authority: local
signing_key_name: "test_dev_rom_key_0"
signing_key_id: "1234567890"
signing_key_file: "tests/signing_keys/rsa_private_key.e3.pem"
public_key_select_classic: 0x01
timestamp: 1764633600
manifest_content_version:
  major: 1
  minor: 0
  patch: 0
payload_images:
  - type: "RSAE3FXXBLSTAGE1"
    path: "examples/oca_classic_basic/dummy_image.bin"
