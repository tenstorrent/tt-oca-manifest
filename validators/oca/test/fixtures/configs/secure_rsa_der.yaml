# RSA-3072 signed manifest with a PKCS#1 DER public key at the modern F4
# exponent (398 bytes). Pairs with secure_rsa_e3_der to cover both DER key
# lengths through the C validator.
manifest_format: oca-classic
manifest_identifier: "RSADER"
description: "RSA-3072 signed fixture (secure_rsa_der)"
secure_boot: 1
signature_type: 0x01
signing_authority: local
signing_key_name: "test_dev_rom_key_0"
signing_key_id: "1234567890"
signing_key_file: "tests/signing_keys/rsa_private_key.dev0.pem"
allow_test_signing_key: true   # committed development key — never for a real build
public_key_select_classic: 0x01
public_key_encoding: 0x01   # PKCS#1 RSAPublicKey
timestamp: 1764633600
manifest_content_version:
  major: 1
  minor: 0
  patch: 0
payload_images:
  - type: "RSADERXXBLSTAGE1"
    path: "examples/oca_classic_basic/dummy_image.bin"
