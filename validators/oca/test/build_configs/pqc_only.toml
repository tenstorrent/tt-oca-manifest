#
# Build configuration for the `pqc-only` target: lib/oca_config.toml with
# Classic compiled out: OCA-Classic manifests are refused with
# OCA_FAIL_UNSUPPORTED_VARIANT.

[variants]
classic = false
pqc = true

[limits]
toc_max_images = 256

[hardening]
recheck_security_version = true

[hash]
sha2_256 = true

[signature_classic]
rsa_3072_pkcs1v15_sha256 = true
ecdsa_p256_sha256 = true

[signature_pqc]
ml_dsa_87 = true

[der]
rsa_public_key = true
ecdsa_signature = true

[encryption_cipher]
aes_128_cbc = true
aes_256_cbc = true

[encryption_kdf]
sp800_108_hmac_sha256 = true

[encryption_key_source]
preshared = true
