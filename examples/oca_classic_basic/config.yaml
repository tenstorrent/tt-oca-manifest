# OCA-classic walkthrough — non-secure-boot, single payload image.
# See README.md in this directory for the full walkthrough.

manifest_format: oca-classic
manifest_identifier: "DEMO1"             # 1-8 printable ASCII chars, NUL-padded by tool
description: "OCA-classic example bundle (non-secure)"

secure_boot: 0

# Optional. Pinning timestamp makes the build byte-deterministic across runs.
timestamp: 1764633600

manifest_content_version:
  major: 1
  minor: 0
  patch: 0

payload_images:
  - type: "DEMO1XXBLSTAGE1"              # 16 ASCII bytes
    path: "examples/oca_classic_basic/dummy_image.bin"
