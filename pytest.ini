[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    aws: tests requiring AWS KMS credentials (deselect with '-m "not aws"')
    hsm: tests for HSM signing (not yet implemented)
    slow: slow-running tests
addopts =
    -v
    --tb=short
    --strict-markers
